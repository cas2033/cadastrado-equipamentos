<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<title>Cadastro de Equipamentos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;font-family:Arial,sans-serif;color:#17212b}
.wrap{max-width:720px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
h1{margin:0 0 6px;font-size:27px;color:#1769aa}p{margin:0;color:#5b6875}
label{display:block;font-weight:700;margin:13px 0 6px}
input,select,button{width:100%;min-height:46px;border-radius:10px;font-size:16px}
input,select{border:1px solid #c8d1da;padding:10px;background:#fff}
button{border:0;padding:10px;font-weight:700}.primary{background:#1769aa;color:#fff}.secondary{background:#e8eef4;color:#173042}
.row,.coords,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{margin-top:10px;padding:10px;border-radius:9px;background:#eef5fb;font-size:14px}
.item{border-top:1px solid #e3e8ed;padding:14px 0}.item:first-child{border-top:0}
.item strong{font-size:17px}.meta{font-size:13px;color:#65727e;margin:5px 0 10px}.danger{background:#f5e8e8;color:#9d2727}
.empty{text-align:center;color:#6b7782;padding:20px 0}
@media(max-width:450px){.row,.coords,.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>📍 Cadastro de Equipamentos</h1>
<p>Cadastre equipamentos e registre automaticamente a localização geográfica.</p>

<section class="card">
<label for="name">Nome do equipamento</label>
<input id="name" placeholder="Ex.: Chave Faca 01">

<label for="type">Tipo</label>
<select id="type">
<option value="">Selecione o tipo</option>
<option>Chave Faca</option>
<option>Chave Fusível</option>
<option>Religador</option>
<option>Regulador de Tensão</option>
<option>Transformador</option>
<option>Medidor</option>
</select>

<div class="coords">
<div><label for="lat">Latitude</label><input id="lat" placeholder="Automática"></div>
<div><label for="lon">Longitude</label><input id="lon" placeholder="Automática"></div>
</div>

<div class="row">
<button type="button" class="primary" id="gps">📍 CAPTURAR GPS</button>
<button type="button" class="secondary" id="save">💾 SALVAR EQUIPAMENTO</button>
</div>
<div id="status" class="status">Pressione “Capturar GPS” estando no local do equipamento.</div>
</section>

<section class="card">
<div class="row" style="align-items:center">
<h2 style="margin:0;font-size:20px">Equipamentos cadastrados</h2>
<button type="button" class="secondary" id="export">⬇️ EXPORTAR CSV</button>
</div>
<label for="search">Pesquisar por nome ou tipo</label>
<input id="search" placeholder="Ex.: Transformador">
<div id="list"></div>
</section>
</div>

<script>
const KEY="equipamentos_campo_v2";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function saveData(){localStorage.setItem(KEY,JSON.stringify(data));}
function status(t){$("status").textContent=t;}

$("gps").addEventListener("click",()=>{
 if(!navigator.geolocation){status("Este navegador não oferece localização GPS.");return}
 status("Obtendo localização… aguarde alguns segundos.");
 navigator.geolocation.getCurrentPosition(pos=>{
   $("lat").value=pos.coords.latitude.toFixed(7);
   $("lon").value=pos.coords.longitude.toFixed(7);
   status("✅ GPS capturado. Precisão aproximada: "+Math.round(pos.coords.accuracy)+" m.");
 },err=>{
   const m={1:"Permissão de localização negada. Autorize o GPS no navegador.",2:"Não foi possível determinar sua posição.",3:"Tempo esgotado ao obter GPS."};
   status("⚠️ "+(m[err.code]||"Erro ao obter GPS."));
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
});

$("save").addEventListener("click",()=>{
 const name=$("name").value.trim(), type=$("type").value;
 const lat=Number($("lat").value), lon=Number($("lon").value);
 if(!name){alert("Informe o nome do equipamento.");return}
 if(!type){alert("Selecione o tipo do equipamento.");return}
 if(!Number.isFinite(lat)||lat<-90||lat>90||!Number.isFinite(lon)||lon<-180||lon>180){
   alert("Capture uma localização GPS válida antes de salvar.");return
 }
 data.unshift({id:Date.now(),name,type,lat,lon,date:new Date().toLocaleString("pt-BR")});
 saveData(); clearForm(); render(); status("✅ Equipamento salvo com sucesso.");
});
function clearForm(){["name","lat","lon"].forEach(id=>$(id).value="");$("type").value="";}
function mapsUrl(e){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.lat+","+e.lon)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const q=$("search").value.trim().toLowerCase();
 const list=data.filter(e=>(e.name+" "+e.type).toLowerCase().includes(q));
 if(!list.length){$("list").innerHTML='<div class="empty">Nenhum equipamento cadastrado.</div>';return}
 $("list").innerHTML=list.map(e=>`
 <div class="item"><strong>${esc(e.name)}</strong>
 <div class="meta">${esc(e.type)} · ${e.lat.toFixed(7)}, ${e.lon.toFixed(7)}<br>Cadastrado: ${esc(e.date)}</div>
 <div class="actions"><button class="primary" data-map="${e.id}">📍 GOOGLE MAPS</button><button class="danger" data-del="${e.id}">🗑️ EXCLUIR</button></div>
 </div>`).join("");
 document.querySelectorAll("[data-map]").forEach(b=>b.onclick=()=>{const e=data.find(x=>x.id==b.dataset.map);if(e)location.href=mapsUrl(e)});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Excluir este equipamento?")){data=data.filter(x=>x.id!=b.dataset.del);saveData();render()}});
}
$("search").addEventListener("input",render);
$("export").addEventListener("click",()=>{
 if(!data.length){alert("Não há equipamentos cadastrados.");return}
 const rows=[["Nome","Tipo","Latitude","Longitude","Data"],...data.map(e=>[e.name,e.type,e.lat,e.lon,e.date])];
 const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="equipamentos.csv";a.click();
});
render();
</script>
</body>
</html>
