<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa"><title>Cadastro de Equipamentos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;font-family:Arial,sans-serif;color:#17212b}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
h1{margin:0 0 6px;font-size:27px;color:#1769aa}h2{font-size:20px;margin:0}p{color:#5b6875}label{display:block;font-weight:700;margin:13px 0 6px}
input,select,button{width:100%;min-height:46px;border-radius:10px;font-size:16px}input,select{border:1px solid #c8d1da;padding:10px;background:#fff}button{border:0;padding:10px;font-weight:700}
.primary{background:#1769aa;color:#fff}.secondary{background:#e8eef4;color:#173042}.danger{background:#f5e8e8;color:#9d2727}.row,.coords,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{margin-top:10px;padding:10px;border-radius:9px;background:#eef5fb;font-size:14px}.item{border-top:1px solid #e3e8ed;padding:14px 0}.item:first-child{border-top:0}.item strong{font-size:17px}.meta{font-size:13px;color:#65727e;margin:5px 0 10px}.badge{display:inline-block;padding:4px 8px;border-radius:12px;background:#e8eef4;font-size:12px;margin-top:5px}.empty{text-align:center;color:#6b7782;padding:20px 0}.offline{font-weight:700;color:#a45b00}.online{font-weight:700;color:#18733b}
@media(max-width:450px){.row,.coords,.actions{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>📍 Cadastro de Equipamentos</h1><p>Cadastre equipamentos e registre a localização. Os dados ficam salvos no celular mesmo sem internet.</p>
<p id="net" class="offline">● Modo offline</p>
<section class="card">
<label for="name">Nome do equipamento</label><input id="name" placeholder="Ex.: Transformador 01">
<label for="type">Tipo</label><select id="type"><option value="">Selecione o tipo</option><option>Chave Faca</option><option>Chave Fusível</option><option>Religador</option><option>Regulador de Tensão</option><option>Transformador</option><option>Medidor</option></select>
<div class="coords"><div><label for="lat">Latitude</label><input id="lat" placeholder="Automática"></div><div><label for="lon">Longitude</label><input id="lon" placeholder="Automática"></div></div>
<div class="row"><button type="button" class="primary" id="gps">📍 CAPTURAR GPS</button><button type="button" class="secondary" id="save">💾 SALVAR EQUIPAMENTO</button></div>
<div id="status" class="status">Sem internet também é possível cadastrar. Pressione “Capturar GPS” no local do equipamento.</div>
</section>
<section class="card"><div class="row" style="align-items:center"><h2>Equipamentos cadastrados</h2><button type="button" class="secondary" id="export">⬇️ EXPORTAR CSV</button></div>
<label for="search">Pesquisar por nome ou tipo</label><input id="search" placeholder="Ex.: Transformador"><div id="list"></div></section>
</div>
<script>
const KEY="equipamentos_campo_offline_v3";let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}
const $=id=>document.getElementById(id);function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("Não foi possível salvar os dados.");return false}}
function status(t){$("status").textContent=t}function updateNet(){let n=navigator.onLine;$("net").textContent=n?"● Internet disponível":"● Modo offline";$("net").className=n?"online":"offline"}
addEventListener("online",updateNet);addEventListener("offline",updateNet);updateNet();
$("gps").onclick=()=>{if(!navigator.geolocation){status("Este navegador não oferece GPS.");return}status("Obtendo localização pelo GPS… aguarde.");navigator.geolocation.getCurrentPosition(p=>{$("lat").value=p.coords.latitude.toFixed(7);$("lon").value=p.coords.longitude.toFixed(7);status("✅ GPS capturado. Precisão aproximada: "+Math.round(p.coords.accuracy)+" m.");},e=>{let m={1:"Permissão de localização negada. Autorize a localização do navegador.",2:"Não foi possível determinar sua posição. Tente novamente.",3:"Tempo esgotado. Tente novamente."};status("⚠️ "+(m[e.code]||"Erro ao obter GPS."));},{enableHighAccuracy:true,timeout:30000,maximumAge:0})};
$("save").onclick=()=>{let name=$("name").value.trim(),type=$("type").value,lat=Number($("lat").value),lon=Number($("lon").value);if(!name)return alert("Informe o nome do equipamento.");if(!type)return alert("Selecione o tipo.");if(!Number.isFinite(lat)||lat<-90||lat>90||!Number.isFinite(lon)||lon<-180||lon>180)return alert("Capture uma localização GPS válida.");data.unshift({id:Date.now(),name,type,lat,lon,date:new Date().toLocaleString("pt-BR")});if(persist()){["name","lat","lon"].forEach(id=>$(id).value="");$("type").value="";render();status("✅ Equipamento salvo no celular. Não precisa de internet.")}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let q=$("search").value.trim().toLowerCase(),list=data.filter(e=>(e.name+" "+e.type).toLowerCase().includes(q));if(!list.length){$("list").innerHTML='<div class="empty">Nenhum equipamento cadastrado.</div>';return}$("list").innerHTML=list.map(e=>`<div class="item"><strong>${esc(e.name)}</strong><div class="meta">${esc(e.type)}<br>📍 ${e.lat.toFixed(7)}, ${e.lon.toFixed(7)}<br>🕒 ${esc(e.date)}<br><span class="badge">Salvo neste celular</span></div><div class="actions"><button class="primary" data-map="${e.id}">📍 ABRIR NO GOOGLE MAPS</button><button class="danger" data-del="${e.id}">🗑️ EXCLUIR</button></div></div>`).join("");document.querySelectorAll("[data-map]").forEach(b=>b.onclick=()=>{if(!navigator.onLine)return alert("O Google Maps precisa de internet. O cadastro continua funcionando offline.");let e=data.find(x=>x.id==b.dataset.map);if(e)location.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(e.lat+","+e.lon)});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Excluir este equipamento?")){data=data.filter(x=>x.id!=b.dataset.del);persist();render()}})}
$("search").oninput=render;$("export").onclick=()=>{if(!data.length)return alert("Não há equipamentos cadastrados.");let rows=[["Nome","Tipo","Latitude","Longitude","Data"],...data.map(e=>[e.name,e.type,e.lat,e.lon,e.date])],csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="equipamentos.csv";a.click()};render();
</script></body></html>
